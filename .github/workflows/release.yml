# Build macOS DMG and attach to GitHub Release on every version tag (v*).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset_suffix: arm64
          - runner: macos-15-intel
            asset_suffix: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller

      - name: Verify tkinter
        run: .venv/bin/python -c "import tkinter; print('tkinter OK')"

      - name: Build DMG
        run: ./scripts/build_release.sh

      - name: Stage release asset
        run: |
          DMG="MIK-to-Rekordbox-${{ matrix.asset_suffix }}.dmg"
          cp dist/MIK-to-Rekordbox.dmg "dist/${DMG}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.asset_suffix }}
          path: dist/MIK-to-Rekordbox-*.dmg
          if-no-files-found: error

  publish:
    needs: build-macos
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download DMGs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dmg-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          draft: false
